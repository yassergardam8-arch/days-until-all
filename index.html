:root{--bg:#eef2f7;--panel:#fff;--ink:#0f1b33;--mute:#5a6785;--line:#d5dceb;--acc:#2447f0;--ink2:#fff;--soft:#e2e9fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans JP","Noto Sans SC",sans-serif;line-height:1.5;position:relative;min-height:100vh;overflow-x:hidden}

.bg-scene span:nth-child(2){width:36vmax;height:36vmax;bottom:-16vmax;right:-10vmax;opacity:.25;animation:driftB 32s ease-in-out infinite}

main{max-width:760px;margin:0 auto;padding:28px 18px 48px}

@keyframes heroIn{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

var DATA=[{"n": "New Year", "c": "Holidays", "d": ["2027-01-01", "2028-01-01", "2029-01-01"], "t": "New Year's Day, January 1, marks the start of the Gregorian calendar year and is a public holiday in most of the world. Celebrations usually begin on New Year's Eve, and because of time zones the new year arrives first in Pacific places such as Kiribati and New Zealand. This countdown uses your device's local time, so it reaches zero at your own midnight.", "s": "new-year", "r": {"t": "fixed", "m": 1, "d": 1}}, {"n": "Valentine's Day", "c": "Holidays", "d": ["2027-02-14", "2028-02-14", "2029-02-14"], "t": "Valentine's Day, February 14, is celebrated in many countries with cards, flowers and dinners for partners, friends and family. The date is fixed, so the weekday changes each year, and restaurants and florists fill up early when it falls near a weekend. A countdown helps you book ahead and order gifts so they arrive in time.", "s": "valentines-day", "r": {"t": "fixed", "m": 2, "d": 14}}, {"n": "St Patrick's Day", "c": "Holidays", "d": ["2027-03-17", "2028-03-17", "2029-03-17"], "t": "The next St Patrick's Day is on Wednesday, March 17, 2027.", "s": "st-patricks-day", "r": {"t": "fixed", "m": 3, "d": 17}}, {"n": "April Fools' Day", "c": "Holidays", "d": ["2027-04-01", "2028-04-01", "2029-04-01"], "t": "The next April Fools' Day is on Thursday, April 1, 2027.", "s": "april-fools-day", "r": {"t": "fixed", "m": 4, "d": 1}}, {"n": "Cinco de Mayo", "c": "Holidays", "d": ["2027-05-05", "2028-05-05", "2029-05-05"], "t": "The next Cinco de Mayo is on Wednesday, May 5, 2027.", "s": "cinco-de-mayo", "r": {"t": "fixed", "m": 5, "d": 5}}, {"n": "the 4th of July", "c": "Holidays", "d": ["2027-07-04", "2028-07-04", "2029-07-04"], "t": "The next 4th of July is on Sunday, July 4, 2027.", "s": "4th-of-july", "r": {"t": "fixed", "m": 7, "d": 4}}, {"n": "Halloween", "c": "Holidays", "d": ["2026-10-31", "2027-10-31", "2028-10-31"], "t": "Halloween takes place on October 31, the eve of All Saints' Day. It has roots in the Celtic festival of Samhain and is now best known for costumes, trick-or-treating and decorations in the United States, Canada and the UK. Check the days left to plan costumes, order supplies and pick your trick-or-treat night.", "s": "halloween", "r": {"t": "fixed", "m": 10, "d": 31}}, {"n": "Christmas Eve", "c": "Holidays", "d": ["2026-12-24", "2027-12-24", "2028-12-24"], "t": "The next Christmas Eve is on Thursday, December 24, 2026.", "s": "christmas-eve", "r": {"t": "fixed", "m": 12, "d": 24}}, {"n": "Christmas", "c": "Holidays", "d": ["2026-12-25", "2027-12-25", "2028-12-25"], "t": "Christmas Day, December 25, celebrates the birth of Jesus in Christian tradition and is a public holiday in most countries. Some Orthodox churches follow the Julian calendar and celebrate on January 7. The date is fixed, but the weekday changes each year, which matters for travel and time off. Shops and couriers set ordering deadlines in the weeks before, so a countdown is useful for gift planning.", "s": "christmas", "r": {"t": "fixed", "m": 12, "d": 25}}, {"n": "New Year's Eve", "c": "Holidays", "d": ["2026-12-31", "2027-12-31", "2028-12-31"], "t": "The next New Year's Eve is on Thursday, December 31, 2026.", "s": "new-years-eve", "r": {"t": "fixed", "m": 12, "d": 31}}, {"n": "Easter", "c": "Moving dates", "d": ["2027-03-28", "2028-04-16", "2029-04-01"], "t": "Easter celebrates the resurrection of Jesus in Christian tradition. In Western churches it falls on the first Sunday after the first full moon on or after March 21, so it can land anywhere from March 22 to April 25. Many Eastern Orthodox churches use a different calendar and often celebrate on another date. Good Friday and Easter Monday are public holidays in many countries, so counting the business days before Easter helps when booking time off.", "s": "easter", "r": {"t": "easter", "o": 0}}, {"n": "Good Friday", "c": "Moving dates", "d": ["2027-03-26", "2028-04-14", "2029-03-30"], "t": "The next Good Friday is on Friday, March 26, 2027.", "s": "good-friday", "r": {"t": "easter", "o": -2}}, {"n": "Thanksgiving (US)", "c": "Moving dates", "d": ["2026-11-26", "2027-11-25", "2028-11-23"], "t": "US Thanksgiving falls on the fourth Thursday of November, while Canada celebrates its own Thanksgiving on the second Monday of October. The US holiday starts one of the busiest travel periods of the year, and Black Friday follows the next day. Because the date is defined by a weekday rather than a number, it moves between November 22 and 28.", "s": "thanksgiving", "r": {"t": "nth", "m": 11, "w": 3, "n": 4}}, {"n": "Black Friday", "c": "Moving dates", "d": ["2026-11-27", "2027-11-26", "2028-11-24"], "t": "Black Friday is the day after US Thanksgiving, so it always falls on a Friday between November 23 and 29. It traditionally opens the holiday shopping season, and many retailers now run sales for days or weeks. Cyber Monday follows on the Monday after. Use the countdown to plan purchases, and check price history before buying, since not every deal is a real discount.", "s": "black-friday", "r": {"t": "relTo", "ref": "thanksgiving", "o": 1}}, {"n": "Cyber Monday", "c": "Moving dates", "d": ["2026-11-30", "2027-11-29", "2028-11-27"], "t": "The next Cyber Monday is on Monday, November 30, 2026.", "s": "cyber-monday", "r": {"t": "relTo", "ref": "thanksgiving", "o": 4}}, {"n": "Mother's Day (US)", "c": "Moving dates", "d": ["2027-05-09", "2028-05-14", "2029-05-13"], "t": "This page shows US Mother's Day, on the second Sunday of May. Many countries use other dates: the UK celebrates Mothering Sunday in March, and Egypt and several other Arab countries celebrate on March 21. If you are sending a gift abroad, check the local date, since the day you need to order by depends on it.", "s": "mothers-day", "r": {"t": "nth", "m": 5, "w": 6, "n": 2}}, {"n": "Father's Day (US)", "c": "Moving dates", "d": ["2027-06-20", "2028-06-18", "2029-06-17"], "t": "The next Father's Day (US) is on Sunday, June 20, 2027.", "s": "fathers-day", "r": {"t": "nth", "m": 6, "w": 6, "n": 3}}, {"n": "Memorial Day (US)", "c": "Moving dates", "d": ["2027-05-31", "2028-05-29", "2029-05-28"], "t": "The next Memorial Day (US) is on Monday, May 31, 2027.", "s": "memorial-day", "r": {"t": "nthlast", "m": 5, "w": 0, "n": 1}}, {"n": "Labor Day (US)", "c": "Moving dates", "d": ["2027-09-06", "2028-09-04", "2029-09-03"], "t": "The next Labor Day (US) is on Monday, September 6, 2027.", "s": "labor-day", "r": {"t": "nth", "m": 9, "w": 0, "n": 1}}, {"n": "Chinese New Year", "c": "Moving dates", "d": ["2027-02-06", "2028-01-26", "2029-02-13"], "t": "Chinese New Year, also called the Spring Festival, follows the lunisolar calendar and falls between about January 21 and February 20. Celebrations last around 15 days and end with the Lantern Festival, and each year is linked to one of 12 zodiac animals. Many businesses in China and across East Asia close for a week or more, so plan orders and travel early.", "s": "chinese-new-year"}, {"n": "Ramadan", "c": "Ramadan & Eid", "d": ["2027-02-08", "2028-01-28"], "t": "Ramadan is the ninth month of the Islamic calendar, during which Muslims fast from dawn to sunset. The Islamic calendar is lunar, so Ramadan begins about 10 to 11 days earlier each year on the Gregorian calendar. The start depends on sighting the new crescent moon, and in Morocco it is announced officially, so the date shown here is an expectation that can move by a day. Eid al-Fitr marks the end of the month.", "s": "ramadan"}, {"n": "Eid al-Fitr", "c": "Ramadan & Eid", "d": ["2027-03-09", "2028-02-26"], "t": "Eid al-Fitr, the Festival of Breaking the Fast, marks the end of Ramadan and falls on 1 Shawwal. It is celebrated with a special morning prayer, family gatherings and charity given before the prayer (zakat al-fitr). Because it depends on the moon, the real date can differ by a day from the one shown, and countries sometimes declare it on different days. Many Muslim-majority countries give several days off.", "s": "eid-al-fitr"}, {"n": "Eid al-Adha", "c": "Ramadan & Eid", "d": ["2027-05-16", "2028-05-05"], "t": "Eid al-Adha, the Festival of Sacrifice, falls on 10 Dhu al-Hijjah, at the end of the Hajj pilgrimage season. It commemorates Ibrahim's willingness to sacrifice his son, and families traditionally sacrifice an animal and share the meat with relatives and people in need. In Morocco it is also known as Eid al-Kabir. The date is set by the moon, so the one shown may be off by a day.", "s": "eid-al-adha"}, {"n": "Islamic New Year", "c": "Ramadan & Eid", "d": ["2027-06-06", "2028-05-26"], "t": "The Islamic New Year, on 1 Muharram, marks the start of the Hijri calendar, which counts from the Prophet Muhammad's migration from Mecca to Medina in 622 CE. It is a public holiday in Morocco and many other Muslim-majority countries and is usually observed quietly. The lunar year is about 11 days shorter than the solar year, so the date moves earlier each year, and moon sighting can shift it by a day.", "s": "islamic-new-year"}, {"n": "Mawlid (Aid Al Mawlid)", "c": "Ramadan & Eid", "d": ["2027-08-15"], "t": "The next Mawlid (Aid Al Mawlid) is on Sunday, August 15, 2027.", "s": "mawlid"}, {"n": "Independence Manifesto Day", "c": "Morocco", "d": ["2027-01-11", "2028-01-11", "2029-01-11"], "t": "The next Independence Manifesto Day is on Monday, January 11, 2027.", "s": "independence-manifesto", "r": {"t": "fixed", "m": 1, "d": 11}}, {"n": "Amazigh New Year (Yennayer)", "c": "Morocco", "d": ["2027-01-14", "2028-01-14", "2029-01-14"], "t": "The next Amazigh New Year (Yennayer) is on Thursday, January 14, 2027.", "s": "amazigh-new-year", "r": {"t": "fixed", "m": 1, "d": 14}}, {"n": "Labour Day", "c": "Morocco", "d": ["2027-05-01", "2028-05-01", "2029-05-01"], "t": "The next Labour Day is on Saturday, May 1, 2027.", "s": "labour-day", "r": {"t": "fixed", "m": 5, "d": 1}}, {"n": "Throne Day", "c": "Morocco", "d": ["2027-07-30", "2028-07-30", "2029-07-30"], "t": "Throne Day (Fête du Trône), on July 30, celebrates the anniversary of King Mohammed VI's accession to the throne in 1999 and is a public holiday in Morocco. It is marked with official ceremonies and national celebrations. The date is fixed, but the weekday changes each year, which matters when planning time off.", "s": "throne-day", "r": {"t": "fixed", "m": 7, "d": 30}}, {"n": "the Revolution of the King and the People", "c": "Morocco", "d": ["2027-08-20", "2028-08-20", "2029-08-20"], "t": "The next Revolution of the King and the People is on Friday, August 20, 2027.", "s": "revolution-of-the-king-and-the-people", "r": {"t": "fixed", "m": 8, "d": 20}}, {"n": "Youth Day", "c": "Morocco", "d": ["2027-08-21", "2028-08-21", "2029-08-21"], "t": "The next Youth Day is on Saturday, August 21, 2027.", "s": "youth-day", "r": {"t": "fixed", "m": 8, "d": 21}}, {"n": "Green March Day", "c": "Morocco", "d": ["2026-11-06", "2027-11-06", "2028-11-06"], "t": "Green March Day, November 6, commemorates the Green March of 1975, when hundreds of thousands of Moroccan volunteers took part in a peaceful march toward the Sahara region. It is a public holiday in Morocco. The date is fixed, so the number of days left drops by one each day, and the weekday changes from year to year.", "s": "green-march", "r": {"t": "fixed", "m": 11, "d": 6}}, {"n": "Independence Day (Morocco)", "c": "Morocco", "d": ["2026-11-18", "2027-11-18", "2028-11-18"], "t": "The next Independence Day (Morocco) is on Wednesday, November 18, 2026.", "s": "moroccan-independence-day", "r": {"t": "fixed", "m": 11, "d": 18}}, {"n": "Laylat al-Qadr", "c": "Ramadan & Eid", "d": ["2027-03-06", "2028-02-23"], "t": "Laylat al-Qadr, the Night of Decree, is the night Muslims believe the Quran was first revealed. It falls in the last ten nights of Ramadan and is sought especially on the odd nights. Many communities observe the 27th night, which is the date used here, while others observe a different odd night. Because Ramadan is set by the moon, the date can shift by a day.", "s": "laylat-al-qadr"}, {"n": "the Day of Arafah", "c": "Ramadan & Eid", "d": ["2027-05-15", "2028-05-04"], "t": "The Day of Arafah is the 9th of Dhu al-Hijjah, the main day of the Hajj, when pilgrims stand at Mount Arafat near Mecca. Many Muslims who are not on pilgrimage fast on this day. It comes the day before Eid al-Adha, and the date depends on the moon sighting.", "s": "day-of-arafah"}, {"n": "Hajj", "c": "Ramadan & Eid", "d": ["2027-05-14", "2028-05-03"], "t": "The Hajj pilgrimage to Mecca takes place in Dhu al-Hijjah, the last month of the Islamic year, with its main rites starting on the 8th and ending around the 12th or 13th. It is one of the five pillars of Islam for those who are able to make the journey. The date shown is the 8th of Dhu al-Hijjah and may shift by a day with the moon sighting.", "s": "hajj"}, {"n": "Ashura", "c": "Ramadan & Eid", "d": ["2027-06-15", "2028-06-04"], "t": "Ashura falls on the 10th of Muharram, the first month of the Islamic year. Many Muslims fast on this day, and it is commemorated in different ways: Sunni Muslims recall the day Musa (Moses) and his people were saved, while Shia Muslims mourn the death of Husayn ibn Ali at Karbala. The date depends on the moon sighting.", "s": "ashura"}, {"n": "Mardi Gras (Shrove Tuesday)", "c": "Christian dates", "d": ["2027-02-09", "2028-02-29", "2029-02-13"], "t": "Mardi Gras, also called Shrove Tuesday or Pancake Day, falls the day before Ash Wednesday, 47 days before Easter. It is the last feast before the fasting of Lent and is marked by carnival celebrations in places such as New Orleans and by pancakes in the UK and Ireland. Its date moves with Easter.", "s": "mardi-gras", "r": {"t": "easter", "o": -47}}, {"n": "Ash Wednesday", "c": "Christian dates", "d": ["2027-02-10", "2028-03-01", "2029-02-14"], "t": "Ash Wednesday is the first day of Lent in Western Christianity, 46 days before Easter Sunday. Many Christians receive ashes on the forehead as a sign of repentance. Because Easter moves each year, so does Ash Wednesday, which falls between February 4 and March 10.", "s": "ash-wednesday", "r": {"t": "easter", "o": -46}}, {"n": "Palm Sunday", "c": "Christian dates", "d": ["2027-03-21", "2028-04-09", "2029-03-25"], "t": "Palm Sunday is the Sunday before Easter and begins Holy Week in Western Christianity. It remembers Jesus entering Jerusalem, welcomed by crowds waving palm branches. Its date changes with Easter.", "s": "palm-sunday", "r": {"t": "easter", "o": -7}}, {"n": "Ascension Day", "c": "Christian dates", "d": ["2027-05-06", "2028-05-25", "2029-05-10"], "t": "Ascension Day is celebrated 39 days after Easter, always on a Thursday. It marks Jesus ascending to heaven in Christian belief, and it is a public holiday in several countries, including France, Germany and Belgium, so long weekends often form around it.", "s": "ascension-day", "r": {"t": "easter", "o": 39}}, {"n": "Pentecost", "c": "Christian dates", "d": ["2027-05-16", "2028-06-04", "2029-05-20"], "t": "Pentecost is celebrated 49 days after Easter, on a Sunday, and marks the coming of the Holy Spirit to the apostles in Christian belief. Whit Monday, the day after, is a public holiday in countries such as Germany and France, so the date matters for planning long weekends.", "s": "pentecost", "r": {"t": "easter", "o": 49}}, {"n": "Orthodox Easter", "c": "Christian dates", "d": ["2027-05-02", "2028-04-16", "2029-04-08"], "t": "Many Eastern Orthodox churches calculate Easter using the Julian calendar, so it usually falls later than Western Easter and sometimes on the same day. The date shown here is given in the standard Gregorian calendar.", "s": "orthodox-easter", "r": {"t": "orthEaster", "o": 0}}, {"n": "Orthodox Christmas", "c": "Christian dates", "d": ["2027-01-07", "2028-01-07", "2029-01-07"], "t": "Orthodox Christmas is celebrated on January 7 by churches that follow the Julian calendar, including the Russian and Serbian Orthodox churches, and by Ethiopian and Coptic Christians. Other Orthodox churches celebrate on December 25.", "s": "orthodox-christmas", "r": {"t": "fixed", "m": 1, "d": 7}}, {"n": "Rosh Hashanah", "c": "Jewish & Hindu", "d": ["2027-10-02", "2028-09-21"], "t": "Rosh Hashanah is the Jewish New Year, observed on the first two days of Tishrei. It begins at sunset the evening before and is marked by hearing the shofar, festive meals with apples and honey, and prayer. It starts the ten Days of Awe that lead up to Yom Kippur.", "s": "rosh-hashanah"}, {"n": "Yom Kippur", "c": "Jewish & Hindu", "d": ["2027-10-11", "2028-09-30"], "t": "Yom Kippur, the Day of Atonement, is the holiest day of the Jewish year. It is observed on 10 Tishrei with a fast of about 25 hours and long prayer services, and it begins at sunset the evening before. It falls nine days after the first day of Rosh Hashanah.", "s": "yom-kippur"}, {"n": "Hanukkah", "c": "Jewish & Hindu", "d": ["2026-12-04", "2027-12-24", "2028-12-12"], "t": "Hanukkah is the eight-night Jewish Festival of Lights, celebrating the rededication of the Second Temple in Jerusalem. One more candle is lit on the menorah each night, starting on 25 Kislev. The date shown is the first evening, when the first candle is lit after sunset.", "s": "hanukkah"}, {"n": "Passover", "c": "Jewish & Hindu", "d": ["2027-04-21", "2028-04-10"], "t": "Passover (Pesach) commemorates the exodus of the Israelites from slavery in Egypt. It starts on the 15th of Nisan, with the first seder held on the evening before, and lasts seven days in Israel and eight elsewhere. Leavened bread is avoided throughout the holiday.", "s": "passover"}, {"n": "Diwali", "c": "Jewish & Hindu", "d": ["2026-11-08", "2027-10-29", "2028-10-17"], "t": "Diwali, the Festival of Lights, celebrates the victory of light over darkness and is observed by Hindus, Jains and Sikhs. Homes are lit with lamps, and families share sweets and prayers to Lakshmi. It is a five-day festival, and the date shown is the main day, which can differ by a day between regions.", "s": "diwali"}, {"n": "Holi", "c": "Jewish & Hindu", "d": ["2027-03-22"], "t": "Holi, the festival of colours, marks the arrival of spring and the triumph of good over evil in Hindu tradition. People throw coloured powder and water, and bonfires are lit the evening before (Holika Dahan). The date follows the lunar calendar, so it moves each year between late February and March.", "s": "holi"}, {"n": "Martin Luther King Jr. Day", "c": "US & Canada", "d": ["2027-01-18", "2028-01-17", "2029-01-15"], "t": "Martin Luther King Jr. Day is a US federal holiday on the third Monday of January that honours the civil rights leader. The date moves between January 15 and 21 and creates a long weekend.", "s": "mlk-day", "r": {"t": "nth", "m": 1, "w": 0, "n": 3}}, {"n": "Presidents' Day (US)", "c": "US & Canada", "d": ["2027-02-15", "2028-02-21", "2029-02-19"], "t": "Presidents' Day, officially Washington's Birthday, is a US federal holiday on the third Monday of February. It makes a long weekend and is a popular time for sales.", "s": "presidents-day", "r": {"t": "nth", "m": 2, "w": 0, "n": 3}}, {"n": "Columbus Day (US)", "c": "US & Canada", "d": ["2026-10-12", "2027-10-11", "2028-10-09"], "t": "Columbus Day is a US federal holiday on the second Monday of October. Many states and cities now mark it as Indigenous Peoples' Day instead.", "s": "columbus-day", "r": {"t": "nth", "m": 10, "w": 0, "n": 2}}, {"n": "Thanksgiving (Canada)", "c": "US & Canada", "d": ["2026-10-12", "2027-10-11", "2028-10-09"], "t": "Canadian Thanksgiving falls on the second Monday of October, about six weeks before the US holiday. It is a statutory holiday in most provinces.", "s": "thanksgiving-canada", "r": {"t": "nth", "m": 10, "w": 0, "n": 2}}, {"n": "Victoria Day (Canada)", "c": "US & Canada", "d": ["2027-05-24", "2028-05-22", "2029-05-21"], "t": "Victoria Day is a Canadian holiday on the last Monday before May 25. It is : {"t": "fixed", "m": 4, "d": 15}}, {"n": "Daylight Saving Time End (US)", "c": "US & Canada", "d": ["2026-11-01", "2027-11-07", "2028-11-05"], "t": "In most of the US, clocks go back one hour at 2 a.m. on the first Sunday of November, giving an extra hour of sleep. Arizona and most of Hawaii do not change their clocks.", "s": "dst-ends-us", "r": {"t": "nth", "m": 11, "w": 6, "n": 1}}, {"n": "Daylight Saving Time Start (US)", "c": "US & Canada", "d": ["2027-03-14", "2028-03-12", "2029-03-11"], "t": "In most of the US, clocks go forward one hour at 2 a.m. on the second Sunday of March, so that night is an hour shorter. Arizona and most of Hawaii do not change their clocks.", "s": "dst-starts-us", "r": {"t": "nth", "m": 3, "w": 6, "n": 2}}, {"n": "Boxing Day", "c": "UK & Europe", "d": ["2026-12-26", "2027-12-26", "2028-12-26"], "t": "Boxing Day, December 26, is a public holiday in the UK, Canada, Australia and other Commonwealth countries, and a big day for shopping sales and sport.", "s": "boxing-day", "r": {"t": "fixed", "m": 12, "d": 26}}, {"n": "Bonfire Night (Guy Fawkes Night)", "c": "UK & Europe", "d": ["2026-11-05", "2027-11-05", "2028-11-05"], "t": "Bonfire Night, November 5, marks the failure of the Gunpowder Plot in 1605 and is celebrated in the UK with bonfires and fireworks.", "s": "bonfire-night", "r": {"t": "fixed", "m": 11, "d": 5}}, {"n": "Burns Night", "c": "UK & Europe", "d": ["2027-01-25", "2028-01-25", "2029-01-25"], "t": "Burns Night, January 25, celebrates the Scottish poet Robert Burns with a supper of haggis, neeps and tatties, poetry and whisky.", "s": "burns-night", "r": {"t": "fixed", "m": 1, "d": 25}}, {"n": "Early May Bank Holiday (UK)", "c": "UK & Europe", "d": ["2027-05-03", "2028-05-01", "2029-05-07"], "t": "The early May bank holiday falls on the first Monday of May and is a public holiday in the UK.", "s": "early-may-bank-holiday", "r": {"t": "nth", "m": 5, "w": 0, "n": 1}}, {"n": "Spring Bank Holiday (UK)", "c": "UK & Europe", "d": [ e": "تفصیل انگریزی میں", "ago": "{n} {d} پہلے", "moreLangs": "مزید زبانیں", "more2": "مزید تفصیل", "less": "کم دکھائیں", "open": "کھولیں", "dates": "آنے والی تاریخیں", "day": "دن", "showMore": "مزید تقریبات دکھائیں"}}, "DESC": {"ramadan": ["رمضان هو الشهر التاسع من التقويم الهجري، ويصوم فيه المسلمون من الفجر إلى الغروب. ولأن التقويم قمري، يبدأ رمضان كل سنة قبل حوالي 10 إلى 11 يوما مقارنة بالسنة الميلادية السابقة.", "Le Ramadan est le neuvième mois du calendrier musulman, pendant lequel les musulmans jeûnent de l'aube au coucher du soleil. Le calendrier étant lunaire, le Ramadan commence environ 10 à 11 jours plus tôt chaque année."], "eid-al-fitr": ["عيد الفطر هو أول أيام شوال، ويحتفل به المسلمون بعد إتمام صيام رمضان. يبدأ بصلاة العيد ثم زيارة الأهل، وتخرج زكاة الفطر قبل الصلاة.", "L'Aïd el-Fitr, ou fête de la rupture du jeûne, marque la fin du Ramadan le 1er chawwal. Il commence par la prière de l'Aïd, suivie de repas en famille et du versement de la zakat al-fitr."], "eid-al-adha": ["عيد الأضحى هو العاشر من ذي الحجة، ويذكّر بقصة إبراهيم عليه السلام. يضحّي فيه المسلمون بالأضحية ويتصدقون منها ويصلون الأرحام، ويعرف في المغرب بعيد الكبير.", "L'Aïd al-Adha, ou fête du sacrifice, a lieu le 10 dhou al-hijja. Il rappelle l'épreuve d'Ibrahim : on sacrifie traditionnellement un mouton et on partage la viande. Au Maroc, on l'appelle aussi l'Aïd el-Kbir."], "laylat-al-qadr": ["ليلة القدر هي الليلة التي نزل فيها القرآن الكريم، وتقع في العشر الأواخر من رمضان، وتُلتمس في الليالي الوترية. ويحييها كثير من المسلمين في ليلة السابع والعشرين، وتبدأ هذه الليلة مساء اليوم الذي يسبق التاريخ المذكور.", "La Nuit du Destin (Laylat al-Qadr) commémore la nuit où le Coran a commencé à être révélé. Elle se situe durant les dix dernières nuits du Ramadan, et beaucoup la célèbrent la nuit du 27e jour, qui commence au coucher du soleil la veille de la date indiquée."], "day-of-arafah": ["يوم عرفة هو التاسع من ذي الحجة، وفيه يقف الحجاج بجبل عرفات، ويستحب لغير الحاج صيامه. ويأتي قبل عيد الأضحى بيوم واحد.", "Le Jour d'Arafat est le 9 dhou al-hijja, jour principal du pèlerinage où les pèlerins se tiennent sur le mont Arafat. Les musulmans qui ne sont pas en pèlerinage jeûnent souvent ce jour-là. Il précède l'Aïd al-Adha d'un jour."], "ashura": ["عاشوراء هو العاشر من محرم، أول شهور السنة الهجرية، ويحرص كثير من المسلمين على صيامه، ويُحيا بطرق مختلفة بحسب البلدان والمذاهب.", "Achoura tombe le 10 muharram, premier mois de l'année musulmane. Beaucoup de musulmans jeûnent ce jour-là, et il est commémoré de différentes manières selon les traditions."], "islamic-new-year": ["رأس السنة الهجرية هو أول محرم، وتحسب به السنة الهجرية من هجرة النبي محمد ﷺ من مكة إلى المدينة سنة 622م. وهو يوم عطلة رسمية في المغرب.", "Le Nouvel An hégirien, le 1er muharram, marque le début du calendrier de l'Hégire, qui compte à partir de l'émigration du prophète Muhammad de La Mecque à Médine en 622. C'est un jour férié au Maroc."], "mawlid": ["المولد النبوي هو ذكرى ميلاد النبي محمد ﷺ في 12 ربيع الأول، ويحتفل به المغاربة بالأذكار والمدائح النبوية والأطعمة العائلية، وهو عطلة رسمية في المغرب.", "Le Mawlid célèbre la naissance du prophète Muhammad le 12 rabi al-awwal. Il est férié au Maroc et marqué par des chants religieux et des repas en famille."]}, "CATS": ["Arab world & Africa", "Asia & World", "Christian dates", "Holidays", "Jewish & Hindu", "Months & years", "Morocco", "Moving dates", "Observances", "Ramadan & Eid", "Rare events", "Seasons", "UK & Europe", "US & Canada"], "LX": {"es": {"c": ["Mundo árabe y África", "Asia y mundo", "Fechas cristianas", "Fiestas", "Fechas judías e hindúes", "Meses y años", "Marruecos", "Fechas móviles", "Días conmemorativos", "Ramadán y Eid", "Eventos raros", "Estaciones", "Reino Unido y Europa", "EE. UU. y Canadá"], "s": ["Primavera", "Verano", "Otoño", "Invierno"], "n": {"new-year": "Año Nuevo", "valentines-day": "San Valentín", "halloween": "Halloween", "christmas-eve": "Nochebuena", "christmas": "Navidad", "new-years-eve": "Nochevieja", "easter": "Pascua" function drawCountdownCard(e){ // 1200x630 -- the standard social-preview aspect ratio
var c=document.createElement("canvas");c.width=1200;c.height=630;var x=c.getContext("2d");
var acc=getComputedStyle(document.documentElement).getPropertyValue("--acc").trim()||"#2447f0";
x.fillStyle=acc;x.fillRect(0,0,1200,630);
x.fillStyle="rgba(255,255,255,.85)";x.font="600 34px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";x.textAlign=lang==="ar"?"right":"left";
var pad=70,rtl=META[lang]&&META[lang].rtl,tx0=rtl?1130:pad,tx1=rtl?1130:pad;
if(e.s)x.fillText(ct(e.c),tx0,120);
x.fillStyle="#fff";x.font="700 60px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
wrapText(x,nm(e),tx1,220,1060,68);
x.font="800 190px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";x.fillText(nf(Math.abs(e.left)),tx1,440);
x.font="600 46px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";x.fillStyle="rgba(255,255,255,.9)";
x.fillText(e.left===0?U.today:dw(e.left),tx1,500);
x.font="400 30px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";x.fillStyle="rgba(255,255,255,.75)";x.fillText(fmt(e.date),tx1,560);
return c}
function wrapText(x,text,tx,ty,maxW,lh){var words=String(text).split(" "),line="",yy=ty,lines=[];
words.forEach(function(w){var test=line?line+" "+w:w;if(x.measureText(test).width>maxW&&line){lines.push(line);line=w}else line=test});
lines.push(line);lines.slice(0,2).forEach(function(l,i){x.fillText(l,tx,yy+i*lh)})}

}else{
